<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- Quill.js CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>

<body>
    <div class="admin-container">
        <header>
            <h1>Content Manager</h1>
            <div class="actions">
                <button id="open-btn" class="btn primary">Open data.json</button>
                <button id="save-btn" class="btn success" disabled>Save Changes</button>
            </div>
        </header>

        <main id="editor-area" class="hidden">
            <div class="tabs">
                <button class="tab-btn active" data-tab="profile">Profile</button>
                <button class="tab-btn" data-tab="biography">Biography</button>
                <button class="tab-btn" data-tab="interests">Interests</button>
                <button class="tab-btn" data-tab="education">Education</button>
                <button class="tab-btn" data-tab="news">News</button>
                <button class="tab-btn" data-tab="projects">Projects</button>
                <button class="tab-btn" data-tab="publications">Publications</button>
                <button class="tab-btn" data-tab="talks">Talks</button>
                <button class="tab-btn" data-tab="teaching">Teaching</button>
            </div>

            <div class="tab-content" id="content-forms">
                <!-- Forms generated by JS -->
            </div>
        </main>

        <div id="status-msg" class="status-msg"></div>
    </div>

    <!-- Quill.js JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="app.js"></script>
</body>

</html>
