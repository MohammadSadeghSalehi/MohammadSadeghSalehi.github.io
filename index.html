<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammad Sadegh Salehi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#2563eb">
</head>

<body>
    <div id="floating-container"></div>
    <div class="app-container">
        <header class="top-bar">
            <div class="top-bar-content">
                <div class="logo-container">
                    <!-- Placeholder for user Logo -->
                    <a href="#" class="site-logo-link">
                        <img src="images/01c_logo.jpg" alt="MSS Logo" class="site-logo-img">
                    </a>
                </div>

                <button class="menu-toggle" aria-label="Toggle Menu">
                    <i class="fas fa-bars"></i>
                </button>

                <nav class="main-nav" id="main-nav">
                    <ul>
                        <li><a href="#about" class="active">About</a></li>
                        <li><a href="#news">News</a></li>
                        <li><a href="#projects">Projects</a></li>
                        <li><a href="#publications">Publications</a></li>
                        <li><a href="#talks">Talks</a></li>
                        <li><a href="#teaching">Teaching</a></li>
                    </ul>
                    <div class="social-links-header" id="social-links-nav"></div>
                    <button id="theme-btn" class="theme-toggle-btn" aria-label="Toggle Dark Mode">
                        <i class="fas fa-moon"></i>
                    </button>
                </nav>
            </div>
        </header>

        <main class="content-area">
            <section class="profile-header-section">
                <img src="" alt="Profile" id="profile-image" class="profile-image-lg">
                <div class="profile-intro">
                    <h1 id="profile-name"></h1>
                    <p id="profile-role"></p>
                    <div class="social-links-main" id="social-links-main"></div>
                </div>
            </section>
            <section id="about" class="section active">
                <h2 class="section-title">Biography</h2>
                <div class="bio-content">
                    <p id="bio-text"></p>
                </div>

                <h3 class="subsection-title">Interests</h3>
                <div class="tags-container" id="interests-list"></div>

                <h3 class="subsection-title">Education</h3>
                <div class="timeline" id="education-list"></div>

                <h3 class="subsection-title">Contact</h3>
                <ul class="contact-list" id="contact-list"></ul>
            </section>

            <section id="news" class="section">
                <h2 class="section-title">Recent News</h2>
                <div class="news-grid" id="news-list"></div>
            </section>

            <section id="projects" class="section">
                <h2 class="section-title">Research Projects</h2>
                <div class="projects-grid" id="projects-list"></div>
            </section>

            <section id="publications" class="section">
                <h2 class="section-title">Publications</h2>
                <div class="publications-list" id="publications-list"></div>
            </section>

            <section id="talks" class="section">
                <h2 class="section-title">Talks</h2>
                <div class="talks-list" id="talks-list"></div>
            </section>

            <section id="teaching" class="section">
                <h2 class="section-title">Teaching</h2>
                <div class="teaching-list" id="teaching-list"></div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="background.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
